  <script type="text/javascript">


    $(document).ready(function() {


      //ref: http://sachinchoolur.github.io/lightslider/settings.html
      var testimonialsSlider =  $('#testimonials-slider').lightSlider({
          gallery: false, // gallery mode, with thumbs etc
          item: 2,        //items on screen at once
          loop: true,     // no need to explain
          //slideMargin: 50, 
          thumbItem: 0,   // thumbnails for gallery mode
          auto: true,     // autoplay
          speed: 400,     // transition speed in ms
          pause: 10000,    // pause in ms every iteration

          responsive: [{
            breakpoint: 1000,
            settings: {
              item: 1       
              }
            }]
      });
      
      $("#btn-testimonials-prev").on("click", function(){
        testimonialsSlider.goToPrevSlide();
      });

      $("#btn-testimonials-next").on("click", function(){
        testimonialsSlider.goToNextSlide();
      });

    //collapse the hamburger menu, on scrollpy links
    $('.nav-link[data-bs-target]').click(function(){
      $("#navbarNavDropdown").removeClass("show");
      $(".toggle input").prop("checked", false);
    });

    const swiper = new Swiper('.swiper', {
      effect: 'coverflow',
      grabCursor: true,
      centeredSlides: true,
      slidesPerView: 'auto',
      coverflowEffect: {
          rotate: 50,
          stretch: 0,
          depth: 100,
          modifier: 1,
          slideShadows: true,
      },
      navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev',
      },
      pagination: {
          el: '.swiper-pagination',
          clickable: true,
      },
      loop: true,
      keyboard: {
          enabled: true,
      },
      breakpoints: {
          320: {
              slidesPerView: 'auto',
              coverflowEffect: {
                  rotate: 40,
                  depth: 80,
              }
          },
          768: {
              slidesPerView: 'auto',
              coverflowEffect: {
                  rotate: 50,
                  depth: 100,
              }
          },
          1024: {
              slidesPerView: 'auto',
              coverflowEffect: {
                  rotate: 50,
                  depth: 100,
              }
          }
      }
  });
});
</script>
